[project]
name = "tonedown"
version = "0.1.0"
description = "Multilingual text safety grading: safe-to-dangerous levels, categories and policies, powered by Jev (TypeSafe System One) with offline fallbacks"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
keywords = ["moderation", "toxicity", "danmaku", "comments", "jev", "typesafe"]
dependencies = [
    "typesafe-sdk>=0.7.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/ziziphus-jujuba-zao/tonedown"
Issues = "https://github.com/ziziphus-jujuba-zao/tonedown/issues"

[project.optional-dependencies]
local = ["transformers>=4.51", "torch>=2.3"]

[project.scripts]
tonedown = "tonedown.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tonedown"]
