[project]
name = "tonedown-server"
version = "0.1.0"
description = "Platform-side moderation API on top of tonedown: pass / review / block for comments, danmaku and posts"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "tonedown",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/ziziphus-jujuba-zao/tonedown"
Issues = "https://github.com/ziziphus-jujuba-zao/tonedown/issues"

[project.scripts]
tonedown-server = "tonedown_server.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tonedown_server"]
