name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: node --check extension/userscript/tonedown.user.js
