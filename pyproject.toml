[project]
name = "tonedown-workspace"
version = "0.1.0"
description = "Workspace root for tonedown: engine, platform API and user-side blocking tools"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/core", "packages/server"]

[tool.uv.sources]
tonedown = { workspace = true }
tonedown-server = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "eval/datasets"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # Depends() in defaults is the FastAPI idiom

[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "packages/server/tests"]
asyncio_mode = "auto"
